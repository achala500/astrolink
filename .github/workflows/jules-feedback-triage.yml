name: Jules Autonomous Feedback Triage

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:
    inputs:
      feedback_url:
        description: 'AstroLink instance URL to fetch feedback from'
        required: false
        default: 'http://localhost:8080'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  triage-feedback:
    name: Triage User Feedback & Assign to Jules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Feedback Triage Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEEDBACK_FILE: feedback_export.json
        run: |
          python .github/scripts/triage_feedback.py

  jules-analysis:
    name: Jules End-of-Day Performance & Stability Analysis
    runs-on: ubuntu-latest
    needs: triage-feedback
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Static Analysis & Performance Audit
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/feedback.py
          python -m py_compile backend/app/licensing.py
          python -m py_compile backend/app/pipeline/gates.py
          python -m py_compile backend/app/pipeline/satellites.py
          python -m py_compile backend/app/pipeline/alignment.py
          python -m py_compile backend/app/pipeline/stacker.py
          python -m py_compile backend/app/pipeline/gradient.py
          python -m py_compile backend/app/pipeline/stretch.py
          python -m py_compile backend/app/pipeline/ingest.py
          echo "All modules compile successfully."

      - name: Run Full Test Suite
        run: |
          python -m pytest backend/ -v --tb=short 2>&1 | tee test_results.txt

      - name: Create Performance Report Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let testResults = '';
            try {
              testResults = fs.readFileSync('test_results.txt', 'utf8');
            } catch(e) {
              testResults = 'Could not read test results.';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[JULES] Test Suite Failures Detected — ${new Date().toISOString().split('T')[0]}`,
              body: `## Automated Test Failure Report\n\nTests failed during the daily Jules analysis run.\n\n### Test Output\n\`\`\`\n${testResults.substring(0, 3000)}\n\`\`\`\n\n### Instructions for Jules\n1. Analyze the failing tests above\n2. Identify root causes in the codebase\n3. Fix the bugs and ensure all 20+ tests pass\n4. Submit a PR with the fixes\n`,
              labels: ['bug', 'jules', 'auto-triage', 'priority: high'],
            });
