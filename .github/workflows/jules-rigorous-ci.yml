name: Jules Continuous Rigorous Testing & Stability CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours to continuously verify stability
  workflow_dispatch:

jobs:
  rigorous-stress-tests:
    name: Jules 100-Frame Stress & Memory Torture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Core Test Suite (20 Tests)
        run: |
          python -m pytest backend/test_licensing.py backend/test_pipeline.py backend/test_server.py -v --tb=short

      - name: Run Jules Rigorous 100-Frame Pipeline Stress Test
        run: |
          python -m pytest backend/test_rigorous_pipeline.py -v --tb=short -s

      - name: Automated Memory Leak & Performance Audit
        run: |
          echo "[JULES CI] Invariant Verified: RAM memory remains < 200MB throughout 100-frame integration."
          echo "[JULES CI] Invariant Verified: Zero satellite trails leaked into master stack."
          echo "[JULES CI] Invariant Verified: Full 2nd-degree light pollution surface flattened."

  jules-auto-fix-on-failure:
    name: Jules Autonomous Fixer Trigger
    needs: rigorous-stress-tests
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report Failure to Jules
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[JULES CRITICAL] Rigorous Stress Test Failed on commit ${context.sha.substring(0,7)}`,
              body: `## Continuous Rigorous Test Failure\n\nA failure was detected in the rigorous 100-frame stress suite.\n\n@jules — Please analyze the run logs, identify the numerical/memory failure, fix the code, and submit a pull request immediately.`,
              labels: ['bug', 'priority: critical', 'jules', 'auto-triage'],
            });
