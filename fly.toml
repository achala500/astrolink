# Fly.io application configuration for AstroLink
app = "astrolink-station"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/status"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
