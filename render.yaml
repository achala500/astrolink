services:
  - type: web
    name: astrolink-field-station
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      # Render supplies PORT automatically; Docker uses 8080 only as a local fallback.
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true
    healthCheckPath: /api/status
