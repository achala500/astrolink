version: "3.9"

services:
  astrolink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrolink-station
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
